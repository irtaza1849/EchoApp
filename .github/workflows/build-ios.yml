name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Remove deprecated expo-barcode-scanner
        run: |
          if grep -q "expo-barcode-scanner" package.json; then
            npm uninstall expo-barcode-scanner
          fi

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned IPA
        run: |
          cd ios
          pod install || true
          xcodebuild -workspace EchoApp.xcworkspace \
            -scheme EchoApp \
            -configuration Release \
            -archivePath ./build/EchoApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            archive
          # Create exportOptions.plist for unsigned IPA
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string></string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath ./build/EchoApp.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          # Create IPA from .app
          mkdir -p Payload
          mv ./build/EchoApp.app ./Payload/
          zip -r EchoApp.ipa Payload
          mv EchoApp.ipa ./build/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EchoApp-unsigned
          path: ios/build/EchoApp.ipa
